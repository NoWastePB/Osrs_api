name: Scrape OSRS Items

on:
  workflow_dispatch:
  schedule:
    # Pas aan naar het schema dat je wilt (dit voorbeeld: elke zondag 03:00 UTC)
    - cron: "0 3 * * 0"

# Voorkomt dat twee runs die main pushen elkaar in de weg zitten.
# cancel-in-progress: false zodat een lange scrape niet halverwege wordt afgebroken
# door een nieuwe run, maar netjes in de wachtrij komt.
concurrency:
  group: osrs-data-push
  cancel-in-progress: false

jobs:
  scrape-items:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install aiohttp beautifulsoup4

      - name: Run item scraper
        run: |
          python scripts/scrape_items.py

      - name: Set UTC timestamp
        run: echo "TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_ENV"

      # Cruciale stap: haal de laatste stand van main op en rebase erop
      # NET VOOR de commit/push, niet aan het begin van de workflow.
      # Na een meerdere-uren-durende scrape is die informatie anders
      # alweer verouderd en loop je opnieuw tegen een non-fast-forward
      # push-fout aan.
      - name: Sync with remote before commit
        run: |
          git fetch origin main
          git rebase origin/main --autostash

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: data/items.json
          commit_message: "Update OSRS items data (${{ env.TIMESTAMP }})"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: NoWastePB <21027636+NoWastePB@users.noreply.github.com>
